name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synchronized package metadata
        run: python3 scripts/validate-package.py
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package version ${PKG_VERSION}"
            exit 1
          fi
      - name: Extract release notes from README
        run: |
          python3 - <<'PYEOF'
          import os
          import re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          readme = open("README.md", encoding="utf-8").read()
          match = re.search(
              rf"(?m)^- \*\*{re.escape(version)}\*\* \u2014 (.+)$", readme
          )
          notes = match.group(1) if match else f"Release v{version}"
          body = (
              f"基于上游 [blader/humanizer](https://github.com/blader/humanizer) "
              f"v{version} 的中文翻译更新。\n\n{notes}\n\n"
              f"安装：`npx skills add https://github.com/Ttungx/humanizer-zh-update.git --global`\n"
          )
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PYEOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Humanizer-zh-update ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
